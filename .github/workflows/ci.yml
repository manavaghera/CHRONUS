name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (sample setup)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CHRONUS
    env:
      # No chroma_db/ or embedding-model download in CI: tests use a throwaway
      # database and a hash embedder, and skip the `corpus` tests (conftest.py)
      CHRONUS_TEST_SAMPLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CHRONUS/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: ruff check .
      - run: python -m pytest

  frontend:
    name: Website lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND/chronus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FRONTEND/chronus-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
