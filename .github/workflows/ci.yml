name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (sample setup)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CHRONUS
    env:
      # No chroma_db/ or embedding-model download in CI: tests use a throwaway
      # database and a hash embedder, and skip the `corpus` tests (conftest.py)
      CHRONUS_TEST_SAMPLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CHRONUS/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: ruff check .
      - run: python -m pytest

  frontend:
    name: Website lint, unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND/chronus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FRONTEND/chronus-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    env:
      CHRONUS_TEST_SAMPLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FRONTEND/chronus-app/package-lock.json
      - name: Build the website
        working-directory: FRONTEND/chronus-app
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CHRONUS/requirements-ci.txt
      - working-directory: CHRONUS
        run: |
          pip install -r requirements-ci.txt playwright
          python -m playwright install --with-deps chromium
      # The built site served by the real API, driven in Chromium
      - working-directory: CHRONUS
        run: python -m pytest tests/test_browser_smoke.py -v
