[project]
name = "chronus"
version = "1.1.0"
description = "CHRONUS: a consent-first, source-cited memory archive you can talk to"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# CHRONUS/ itself is the import root (api_server, config, services/...)
pythonpath = ["."]
markers = ["corpus: needs the real embedding model and Elon's full collection (skipped otherwise)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"
# One-off data-preparation and research scripts are kept as they were run
extend-exclude = ["06-Testing", "01-Raw-Data", "02-Cleaned-Data", "lora", "figures", "merge_sources.py", "chat_cli.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I001"]
ignore = ["E402", "E501", "E731"]
