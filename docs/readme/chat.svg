<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5500;0.5719;0.9125;0.9500;1.0000" dur="16.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0;0 0;0 0;0 12" keyTimes="0.0000;0.5500;0.5719;0.9125;0.9500;1.0000" dur="16.0s" repeatCount="indefinite"/><rect x="80" y="524" width="800" height="60" rx="20" fill="#1a110c" stroke="#FF6436" stroke-opacity=".28"/><rect x="80" y="524" width="5" height="60" rx="2.5" fill="#FFB394"/><text x="106" y="560" class="sans" font-size="17.5" fill="#FFF3EC" clip-path="url(#r2)">I don't have any documented information about that in my available records.</text></g>
